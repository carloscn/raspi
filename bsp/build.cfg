# SD_DEV is only for `make hw-sd` / `make sd`. Set it in the environment.
# CROSS_PREFIX is the aarch64 toolchain prefix. Leave it empty to use
# $RB_INPUTS/bin/aarch64-none-linux-gnu- or whatever is on PATH.
export USER_NAME=raspi
export PASSWD=raspi
export REPO_FIRMWARE=https://github.com/raspberrypi/firmware
export REPO_UBOOT=https://github.com/u-boot/u-boot
export REPO_LINUX=https://github.com/raspberrypi/linux
export REPO_BUILDROOT=https://github.com/gamaral/rpi-buildroot.git

export ROOTFS_TAR=https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2023-12-11/2023-12-11-raspios-bookworm-arm64-lite.img.xz
export RAMDISK_TAR=https://www.nxp.com/lgfiles/sdk/lsdk2012/rootfs_lsdk2012_yocto_tiny_arm64.cpio.gz
